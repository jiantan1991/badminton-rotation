<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><title>云存储诊断</title></head>
<body>
<h3>云存储诊断 v3</h3>
<div id="log"></div>
<script src="js/vendor/cloudbase-sdk.js"></script>
<script src="js/cloud.js"></script>
<script>
  var log = document.getElementById('log');
  function line(msg) { log.innerHTML += msg + '<br>'; }
  BadRot.cloud.init(function (ok) {
    line('init: ' + ok + ' | enabled: ' + BadRot.cloud.isEnabled());
    if (!ok) return;
    // 直接调 SDK 拿错误详情（cloudPath 必须含 bucket 前缀）
    var app = window.cloudbase.init({ env: BadRot.cloud.CONFIG.envId });
    app.uploadFile({ cloudPath: BadRot.cloud.CONFIG.bucket + '/activity.json', fileContent: JSON.stringify({ test: 123 }) })
      .then(function (res) {
        line('upload OK: fileID=' + (res && res.fileID));
        line('✅ 写入成功！请到控制台 → 存储 查看 activity.json，把 bucket 名/文件路径发我');
      })
      .catch(function (err) {
        line('upload ERROR JSON: ' + JSON.stringify(err));
        line('upload ERROR props: ' + (err ? Object.getOwnPropertyNames(err).join(',') : 'null'));
        line('upload ERROR toString: ' + (err ? String(err) : 'null'));
        console.log('UPLOAD_ERR', err);
      });
  });
</script>
</body>
</html>
